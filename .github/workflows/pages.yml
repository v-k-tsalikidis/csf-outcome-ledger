name: Pages

# Publishes the app to https://v-k-tsalikidis.github.io/CSF-Outcome-Ledger/
# so it can be opened and used without cloning anything.
#
# The tests run here as well as in CI. That is deliberate: this workflow
# decides what the public sees, and a deploy step that publishes whatever
# it was handed is how a broken app goes live while the build stays green
# somewhere else. Formatting and lint stay in CI, because they are style
# and cannot break the published page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In progress runs finish rather than being
# cancelled, so a half-uploaded artifact is never what gets published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      # `npm run build` is `tsc && vite build`, so a type error stops the
      # deploy rather than shipping a page that fails at runtime.
      - name: Build
        run: npm run build

      # Pages has to be switched on once by hand, under
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # This step used to pass `enablement: true` to do that automatically
      # and failed: the workflow token cannot turn Pages on for a repository
      # that has never had it. Reading the existing configuration is what
      # this action is for.
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # A project site is served from /CSF-Outcome-Ledger/, and vite.config.ts
      # builds the asset paths to match. Serving it from anywhere else needs
      # BASE_PATH set, or the page loads and then 404s on its own JavaScript.
      - name: Upload the built site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
